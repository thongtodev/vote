<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote Clock — Đếm ngược tùy chỉnh</title>
<meta name="description" content="Bảng theo dõi tài khoản và thời gian chờ tùy chỉnh để vote lại.">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25322f;background:#f5f7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9cdbbf;outline-offset:2px}header{height:76px;background:white;border-bottom:1px solid #e1e8e3;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.5px;font-size:20px}.logo{width:35px;height:35px;border-radius:10px;background:#1d654f;color:white;display:grid;place-items:center;font-size:24px}.headnote{font-size:12px;color:#64746b}.dot{display:inline-block;width:7px;height:7px;background:#339575;border-radius:100%;margin-right:6px}main{max-width:1440px;margin:auto;padding:48px 5vw}.eyebrow{color:#688177;font-size:11px;font-weight:750;letter-spacing:2px;text-transform:uppercase}h1{font-size:36px;letter-spacing:-1.3px;margin:12px 0 10px;font-weight:650}p{color:#6a7971;font-size:14px;line-height:1.7;margin:0}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px}.primary{background:#246d56;color:#fff;border:1px solid #246d56;border-radius:9px;padding:12px 18px;font-weight:600;white-space:nowrap}.primary:hover{background:#19523f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.stat{background:#fff;border:1px solid #e1e8e3;border-radius:12px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.stat span{font-size:13px;color:#718078}.stat b{font-size:29px;font-weight:600;font-variant-numeric:tabular-nums}.stat.ready b{color:#257655}.stat.wait b{color:#bc8839}.sheet{background:#fff;border:1px solid #dce5df;border-radius:13px;overflow:hidden;box-shadow:0 4px 20px #24392e04}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px}.toolbar strong{font-size:15px}.search{width:250px;max-width:50%;border:1px solid #e1e7e2;background:#fafbfa;padding:10px 12px;border-radius:7px;font-size:13px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1020px;table-layout:fixed}th{text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:1px;color:#7a867f;background:#f8faf8;padding:14px 15px;border-top:1px solid #e4eae5;border-bottom:1px solid #e4eae5;font-weight:650}td{height:96px;padding:14px 15px;border-bottom:1px solid #edf0ed;vertical-align:middle}th+th,td+td{border-left:1px solid #edf0ed}th:first-child{width:48px}th:nth-child(2){width:23%}th:nth-child(3){width:17%}th:nth-child(4){width:17%}th:nth-child(5){width:160px}th:nth-child(6){width:185px}th:last-child{width:50px}.number{font-size:12px;color:#97a29a;text-align:center}.cell{width:100%;border:1px solid transparent;border-radius:5px;background:transparent;padding:9px 6px;font-size:13px;min-width:0;color:#34463d}.cell:hover{border-color:#dbe5dd}.cell:focus{border-color:#76ae95;background:#fff}.cell::placeholder{color:#acb5af}.password{display:flex;align-items:center}.password .cell{flex:1}.icon{background:transparent;border:0;color:#87958b;padding:5px;border-radius:5px;font-size:13px}.icon:hover{background:#edf3ee;color:#246d56}.time{border-color:#e0e7e1;background:#fafcfb}.time-tools{display:flex;justify-content:space-between;margin-top:5px}.textbtn{border:0;padding:3px;background:transparent;font-size:10px;color:#397b61}.textbtn:hover{text-decoration:underline}.countdown{font-size:22px;letter-spacing:.5px;font-weight:600;font-variant-numeric:tabular-nums;color:#a17835}.countdown.ready{font-size:15px;letter-spacing:0;color:#287655}.countdown.empty{font-size:13px;letter-spacing:0;color:#9aa69d;font-weight:400}.due{display:block;color:#96a096;font-size:10px;margin-top:5px}.track{height:3px;background:#f0eee6;margin-top:10px;border-radius:4px;overflow:hidden}.fill{height:100%;background:#c8ab72;width:0;transition:width 1s linear}.sheetfoot{display:flex;justify-content:space-between;padding:17px 23px;gap:10px;color:#8b978e;font-size:11px}.sheetfoot button{border:0;background:transparent;color:#307355;font-size:12px;font-weight:600}.help{display:flex;gap:12px;align-items:flex-start;margin-top:24px;background:#edf3ee;padding:16px 20px;border-radius:9px}.help b{font-size:13px;display:block;margin-bottom:4px;color:#4d6b59}.help p{font-size:12px;color:#7a8b7e}.bottom{font-size:11px;color:#99a59c;margin-top:22px;display:flex;justify-content:space-between;gap:20px}#empty{padding:30px;text-align:center;color:#8a978d;font-size:13px}#notice{color:#a36725;font-size:12px;margin-top:15px}@media(max-width:650px){header{padding:0 20px}.headnote{display:none}main{padding:30px 18px}h1{font-size:28px}.intro{align-items:flex-start;flex-direction:column}.stats{gap:8px;margin:24px 0}.stat{padding:15px 12px;align-items:flex-start;flex-direction:column;gap:8px}.stat span{font-size:10px}.stat b{font-size:24px}.toolbar{padding:16px}.search{width:170px}.sheetfoot,.bottom{flex-direction:column}.help{padding:15px}.primary{padding:10px 15px}}
table{width:max-content;min-width:100%;table-layout:fixed}th:nth-child(n){width:160px}th:first-child{width:48px}th:nth-child(2){width:240px}th:nth-child(3){width:180px}th:nth-child(4){width:180px}th:nth-last-child(2){width:195px}th:last-child{width:50px}.today-cell{background:#f2f8f3}th.today-cell{color:#246d56}.day-caption{font-size:9px;display:block;margin-top:5px;font-weight:400;letter-spacing:.3px}.group-row td{height:auto;padding:0;background:#edf3ee;border-bottom:1px solid #dbe5dd}.group-bar{display:flex;align-items:center;gap:16px;min-height:48px;padding:8px 16px;position:sticky;left:0;width:min(100%,800px)}.group-toggle{background:none;border:0;text-align:left;color:#2c6249;font-weight:650;font-size:13px;padding:6px 0;max-width:350px;overflow-wrap:anywhere}.group-status{color:#7c8b80;font-size:11px}.group-add{margin-left:auto;border:1px solid #d5e2d8;border-radius:6px;padding:6px 10px;background:#fff;color:#427354;white-space:nowrap;font-size:11px}.group-controls{display:flex;gap:8px;align-items:center;margin-top:8px;color:#9aa89e}.group-controls button{background:none;border:0;padding:0;color:#60816d;font-size:11px}tr[hidden]{display:none}.cloudbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 5vw;background:#eaf2ec;font-size:12px;color:#436550}.cloudbar span{margin-right:auto}.cloudbar button{padding:7px 10px;border:1px solid #ccded1;border-radius:6px;color:#356346;background:white;cursor:pointer}main[inert]{opacity:.55}.intro{justify-content:flex-end}.bottom{justify-content:flex-end}main{padding-top:24px}</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">◷</span>vote clock<span style="font-size:11px;letter-spacing:0;color:#84958b;font-weight:500;margin-left:5px">/ TIMER</span></div><div class="headnote"><span class="dot"></span>Bảng chung</div></header>
<div class="cloudbar"><span id="cloudStatus" role="status">Đang kết nối Firebase…</span><button id="retryCloud" hidden>Thử lưu lại</button></div><main inert>
<div class="intro"><button class="primary" id="add">＋ Thêm tài khoản</button></div>
<section class="stats" aria-label="Tổng quan"><div class="stat"><span>TỔNG TÀI KHOẢN</span><b id="total">0</b></div><div class="stat wait"><span>ĐANG CHỜ</span><b id="waiting">0</b></div><div class="stat ready"><span>CÓ THỂ VOTE LẠI</span><b id="ready">0</b></div></section>
<section class="sheet"><div class="toolbar"><div><strong>Danh sách tài khoản</strong><div class="group-controls"><button id="collapseAll">Thu gọn tất cả</button><span>·</span><button id="expandAll">Mở rộng tất cả</button></div></div><input class="search" id="search" placeholder="Tìm mail, người nhận…" aria-label="Tìm tài khoản"></div><div class="scroll"><table><thead><tr id="headers"><th>#</th><th>Tài khoản mail</th><th>Pass</th><th>Người nhận</th><th>Giờ vừa vote</th><th>Đếm ngược</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" hidden>Chưa có tài khoản phù hợp.</div><div class="sheetfoot"><button id="addBottom">＋ Thêm một dòng</button><span id="saveState">Đang kết nối Firebase…</span></div></section>
<div class="bottom"><span id="clock"></span></div><div id="notice" role="status"></div>
</main>
<script>setTimeout(()=>{if(document.querySelector("main").inert)document.getElementById("cloudStatus").textContent="Chưa kết nối được. Kiểm tra mạng, bật Anonymous Auth và cài Firestore Rules theo README.";},20000);</script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script src="groups.js"></script>
<script src="table.js"></script>
<script type="module" src="cloud.js"></script>
</body>
</html>
